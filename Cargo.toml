[package]
name = "fake_asia"
version = "0.1.0"
edition = "2021"
authors = ["fake_asia contributors"]
description = "A realistic fake data generator library for Asian countries (China, Japan, South Korea, India) with authentic postal codes"
documentation = "https://docs.rs/fake_asia"
repository = "https://github.com/xjz6626/fake_asia.git"
license = "MIT"
keywords = ["fake", "data", "generator", "asia", "test"]
categories = ["development-tools::testing"]
readme = "README.md"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"], optional = true }
fake_asia_derive = { path = "fake_asia_derive", optional = true }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"
